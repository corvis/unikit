[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "unikit"
version = "1.2.0"
license = "MIT"
description = "A versatile Python library that provides a set of generic classes and utilities for common application needs, including dependency injection, object registries, file system abstraction, string parsing, and many others. Designed to streamline development, UniKit offers reusable tools to simplify building robust and scalable applications."
authors = ["Dmitry Berezovsky <unikit-dev@googlegroups.com>"]
maintainers = ["Dmitry Berezovsky <unikit-dev@googlegroups.com>"]
repository = "https://github.com/corvis/unikit"
keywords = ["toolkit", "core utilities", "dependency injection", "registry", "parsing", "generics", "python tools", "application development", "di"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
packages = [{ include = "unikit", from = "src" }]
exclude = ["src/unikit/**/test_*", "src/unikit/**/tests"]

[tool.poetry.dependencies]
python = ">=3.11,<4"
injector = ">=0.20"
pydantic = ">=1.8.2,<3.0.0"

# Optional dependencies
django = { version = ">=3.0", optional = true }
celery = { version = ">=5.0", optional = true }
django-environ = { version = ">=0.10.0", optional = true }
taskiq = { version = ">=0.11.7", optional = true }
redis = { version = ">=4.0.0", optional = true }
opentelemetry-sdk = { version = ">=1.29.0", optional = true }

[tool.poetry.group.dev.dependencies]
# Unit tests
coverage = { version = "=6.5", extras = ["toml"] }
pytest = "~=7.2"
pytest-subtests = "~=0.4"
pytest-cov = "~=4.0"
teamcity-messages = ">=1.31"

# Dev tools
ruff = ">=0.15.7"
licenseheaders = ">=0.8"
mypy = ">=1.11.2"
pre-commit = "<4.0"
commitizen = ">=3.16.0"

# Type checking
types-dateparser = ">=1.1.3"
types-deprecated = ">=1.2.9"
types-redis = ">=4.0.0"
types-requests = ">=2.0"

[tool.poetry.extras]
django = ["django", "django-environ"]
celery = ["celery"]
taskiq = ["taskiq"]
redis = ["redis"]
otlp = [
    "opentelemetry-sdk",
]

[tool.commitizen]
version_provider = "poetry"
bump_version = "bump: version $current_version → $new_version"
update_changelog_on_bump = true
pre_bump_hooks = []
version_files = [
    "src/unikit/__version__.py",
]

# Tests and Coverage
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--maxfail=50"
python_files = ["test_*.py"]
required_plugins = ["pytest-subtests", "pytest-cov"]
testpaths = ["src"]

[tool.coverage.run]
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "coverage_report/htmlcov"

[tool.mypy]
python_version = "3.11"
show_error_codes = true
ignore_errors = false
warn_return_any = false
disallow_any_generics = false
warn_unused_ignores = true
pretty = true
strict = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/stubs"
exclude = ["test_.*\\.py$", "test\\.py$"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# External libs which doesn't have type hints (py.typed marker)
module = ["django.*", "celery.*", "environ.*", "ipware.*", "taskiq_redis.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".*pyi"]

[tool.ruff.lint.isort]
known-third-party = []
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"**.pyi" = ["UP"]
"test_*.py" = ["D103", "D104", "D100", "D101", "D102", "D106"]
"__version__.py" = ["D104", "D100", "D101", "D102"]

[tool.ruff.lint]
extend-ignore = [
    "S101",  # Use of assert statement. We have a lot of asserts for mypy type checking.
    "S324", # We cannot ignore sha1 hash in codebase because it is used by box.com

    # Target to resolve:
    "S113", # Requests without timout. We need to fix this, but it is not a blocker.
        # D202 No blank lines allowed after function docstring
    "D202",
    # W504 line break after binary operator
    ##### DOCSTRINGS #####
    # Missing docstring in public module
    "D100",
    # Missing docstring in __init__
    "D107",
    # Missing docstring in magic method
    "D105",
    # Missing docstring in public package
    "D104",
    # Missing docstring in public nested class
    "D106",
    # One black line required before class docstring
    "D203",
    #`no-blank-line-before-class
    "D211",
    # Multi-line docstring summary should start at the second line
    "D212",
    # Multi-line docstring summary should start at the first line
    "D213",
    # Raw string in exception
    "EM101",
    # f-string in exception
    "EM102",
]
extend-select = ["S","E", "B", "A", "EM", "UP", "D", "C90"]

[tool.ruff.lint.flake8-type-checking]
# Add quotes around type annotations, if doing so would allow
# an import to be moved into a type-checking block.
quote-annotations = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 10
